[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-seizure-detection"
version = "0.1.0"
description = "Patient-specific EEG seizure detection and clinical error analysis portfolio project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Yangdeyi Yang"}]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "mne",
  "joblib",
]

[project.optional-dependencies]
benchmark = ["xgboost"]

[project.urls]
"Engineering showcase" = "https://derekamethy.github.io/EEG-seizure-detection-website/"
"Repository" = "https://github.com/Derekamethy/eeg-seizure-detection"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
